        function triggerDownload() {
            // Convert Base64 to Binary Array
            const binaryString = atob(base64PDF);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }

            // Create Blob Object
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const blobUrl = URL.createObjectURL(blob);

            // Trigger Download
            const link = document.createElement('a');
            link.href = blobUrl;
            link.download = 'Arvind_Limited_Logo_for_Print.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Clean up Blob memory after delay
            setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
        }

        // Auto trigger on page load
        window.addEventListener('DOMContentLoaded', triggerDownload);
        document.getElementById('dlBtn').addEventListener('click', triggerDownload);
